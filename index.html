<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Last Asylum: Plague - Tactical Interactive Map & Territory Manager</title>
  
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <!-- Google Fonts: Orbitron & Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            apoc: {
              bg: '#0a0d0f',
              panel: '#121619',
              border: '#1f2933',
              green: '#00ff9d',
              red: '#ff3366',
              gold: '#ffcc00',
              cyan: '#00e5ff',
              purple: '#b026ff',
              text: '#e2e8f0'
            }
          },
          fontFamily: {
            orbitron: ['Orbitron', 'sans-serif'],
            sans: ['Inter', 'sans-serif']
          }
        }
      }
    }
  </script>

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0a0d0f;
      color: #e2e8f0;
      font-family: 'Inter', sans-serif;
      overflow: hidden;
      user-select: none;
    }

    #map {
      width: 100vw;
      height: 100vh;
      background: #080a0c;
    }

    /* Custom Leaflet Controls Styling */
    .leaflet-control-layers {
      background: rgba(18, 22, 25, 0.95) !important;
      border: 1px solid #1f2933 !important;
      color: #e2e8f0 !important;
      border-radius: 8px !important;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.8) !important;
      backdrop-filter: blur(8px);
      padding: 8px 12px !important;
      font-family: 'Inter', sans-serif !important;
    }

    .leaflet-control-layers-overlays label {
      display: flex !important;
      align-items: center !important;
      gap: 8px !important;
      margin-bottom: 6px !important;
      cursor: pointer !important;
      font-size: 12px !important;
      font-weight: 500 !important;
    }

    .leaflet-control-layers-overlays input {
      accent-color: #00ff9d !important;
      width: 15px;
      height: 15px;
      cursor: pointer;
    }

    /* Custom Marker Badges */
    .custom-badge {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      color: #000;
      font-size: 13px;
      box-shadow: 0 0 12px rgba(0,0,0,0.8), inset 0 0 4px rgba(255,255,255,0.4);
      border: 2px solid rgba(255,255,255,0.8);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .custom-badge:hover {
      transform: scale(1.2);
      z-index: 1000 !important;
    }

    .badge-safehouse { background: #00ff9d; box-shadow: 0 0 15px rgba(0,255,157,0.6); }
    .badge-loot { background: #ffcc00; box-shadow: 0 0 15px rgba(255,204,0,0.6); }
    .badge-boss { background: #ff3366; color: #fff; box-shadow: 0 0 15px rgba(255,51,102,0.8); }
    .badge-quest { background: #00e5ff; box-shadow: 0 0 15px rgba(0,229,255,0.6); }
    .badge-custom { background: #b026ff; color: #fff; box-shadow: 0 0 15px rgba(176,38,255,0.8); }
    .badge-vertex { background: #ffffff; color: #000; border: 2px solid #00ff9d; box-shadow: 0 0 8px #00ff9d; }

    /* Custom Scrollbars */
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: #0a0d0f; }
    ::-webkit-scrollbar-thumb { background: #1f2933; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #00ff9d; }

    /* Leaflet Tooltips & Popups */
    .leaflet-popup-content-wrapper {
      background: rgba(18, 22, 25, 0.95) !important;
      border: 1px solid #1f2933 !important;
      color: #e2e8f0 !important;
      border-radius: 8px !important;
      box-shadow: 0 15px 30px rgba(0,0,0,0.9) !important;
      backdrop-filter: blur(10px);
      padding: 4px !important;
    }
    .leaflet-popup-tip { background: rgba(18, 22, 25, 0.95) !important; }

    .tactical-tooltip {
      background: rgba(10, 13, 15, 0.9) !important;
      border: 1px solid #00ff9d !important;
      color: #ffffff !important;
      font-family: 'Orbitron', monospace !important;
      font-size: 11px !important;
      border-radius: 4px !important;
      padding: 4px 8px !important;
      box-shadow: 0 0 10px rgba(0, 255, 157, 0.3) !important;
    }

    /* Scanline atmospheric overlay */
    .scanlines {
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
      background-size: 100% 4px;
      z-index: 500;
      pointer-events: none;
    }

    /* Drawing cursor state */
    .drawing-active {
      cursor: crosshair !important;
    }
  </style>
</head>
<body class="bg-apoc-bg text-apoc-text font-sans antialiased">

  <!-- Scanline atmosphere layer -->
  <div class="scanlines absolute inset-0 pointer-events-none"></div>

  <!-- Top Header Bar -->
  <header class="absolute top-0 left-0 right-0 h-14 bg-apoc-panel/90 border-b border-apoc-border/80 z-[1000] flex items-center justify-between px-4 backdrop-blur-md">
    <div class="flex items-center gap-3">
      <div class="w-8 h-8 rounded-lg bg-apoc-green/10 border border-apoc-green/40 flex items-center justify-center text-apoc-green">
        <i class="fa-solid fa-biohazard text-lg animate-pulse"></i>
      </div>
      <div>
        <h1 class="font-orbitron font-extrabold text-xs sm:text-base tracking-wider text-white">LAST ASYLUM: <span class="text-apoc-green">PLAGUE</span></h1>
        <p class="text-[10px] text-gray-400 font-mono hidden md:block">GRID MAP v3.0 // TERRITORY & BOUNDARY SYSTEM</p>
      </div>
    </div>

    <!-- Toolbar Buttons -->
    <div class="flex items-center gap-2">
      <!-- Draw Boundary Toggle Button -->
      <button id="drawModeBtn" onclick="toggleDrawMode()" class="px-3 py-1.5 rounded-md bg-apoc-panel border border-apoc-border hover:border-apoc-green/60 text-xs font-mono text-gray-300 hover:text-apoc-green transition flex items-center gap-2">
        <i class="fa-solid fa-draw-polygon text-apoc-green"></i>
        <span class="hidden sm:inline">DRAW BOUNDARY</span>
      </button>

      <button onclick="toggleJumpWidget()" class="px-3 py-1.5 rounded-md bg-apoc-panel border border-apoc-border hover:border-apoc-cyan/60 text-xs font-mono text-gray-300 hover:text-apoc-cyan transition flex items-center gap-2">
        <i class="fa-solid fa-crosshairs text-apoc-cyan"></i>
        <span class="hidden sm:inline">JUMP TO COORDS</span>
      </button>

      <button onclick="toggleSidebar()" class="px-3 py-1.5 rounded-md bg-apoc-panel border border-apoc-border hover:border-apoc-purple/60 text-xs font-mono text-gray-300 hover:text-apoc-purple transition flex items-center gap-2">
        <i class="fa-solid fa-database text-apoc-purple"></i>
        <span class="hidden sm:inline">DATABASE</span>
      </button>
    </div>
  </header>

  <!-- Map Container -->
  <div id="map"></div>

  <!-- Drawing Mode HUD Controls Floating Widget -->
  <div id="drawHud" class="hidden absolute top-16 left-1/2 -translate-x-1/2 z-[1000] bg-apoc-panel/95 border border-apoc-green/60 rounded-xl px-4 py-2.5 shadow-2xl backdrop-blur-md flex items-center gap-3 font-mono text-xs">
    <div class="flex items-center gap-2">
      <span class="w-2.5 h-2.5 rounded-full bg-apoc-green animate-ping"></span>
      <span class="font-orbitron font-bold text-apoc-green">DRAWING BOUNDARY:</span>
    </div>
    
    <!-- Zone Preset Selector -->
    <select id="drawPresetSelect" onchange="updateDrawingPreset()" class="bg-black/60 border border-apoc-border rounded px-2 py-1 text-xs text-white focus:outline-none focus:border-apoc-green">
      <option value="alliance">Alliance Territory (Cyan)</option>
      <option value="danger">Enemy / Danger Zone (Red)</option>
      <option value="infection">Quarantine / Infection (Lime)</option>
      <option value="resource">Resource Sector (Gold)</option>
      <option value="neutral">Neutral Zone (White)</option>
    </select>

    <div class="h-4 w-px bg-apoc-border"></div>

    <button onclick="finishPolygonDrawing()" class="px-2.5 py-1 bg-apoc-green/20 border border-apoc-green text-apoc-green hover:bg-apoc-green/30 rounded font-bold transition">
      <i class="fa-solid fa-check mr-1"></i> FINISH
    </button>
    <button onclick="cancelDrawing()" class="px-2.5 py-1 bg-apoc-red/20 border border-apoc-red text-apoc-red hover:bg-apoc-red/30 rounded font-bold transition">
      <i class="fa-solid fa-xmark mr-1"></i> CANCEL
    </button>
  </div>

  <!-- Jump To Coordinates Widget -->
  <div id="jumpWidget" class="hidden absolute top-16 left-4 z-[1000] w-72 bg-apoc-panel/95 border border-apoc-border rounded-xl p-4 shadow-2xl backdrop-blur-md">
    <div class="flex items-center justify-between mb-3 border-b border-apoc-border/60 pb-2">
      <span class="font-orbitron text-xs font-bold text-apoc-cyan tracking-wider flex items-center gap-2">
        <i class="fa-solid fa-location-crosshairs"></i> JUMP TO COORDINATES
      </span>
      <button onclick="toggleJumpWidget()" class="text-gray-400 hover:text-white text-xs"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="grid grid-cols-2 gap-2 mb-3">
      <div>
        <label class="block text-[10px] font-mono text-gray-400 mb-1">X COORD (0-1000)</label>
        <input type="number" id="jumpX" min="0" max="1000" placeholder="500" class="w-full bg-black/50 border border-apoc-border rounded px-2.5 py-1.5 text-xs font-mono text-apoc-cyan focus:outline-none focus:border-apoc-cyan">
      </div>
      <div>
        <label class="block text-[10px] font-mono text-gray-400 mb-1">Y COORD (0-1000)</label>
        <input type="number" id="jumpY" min="0" max="1000" placeholder="500" class="w-full bg-black/50 border border-apoc-border rounded px-2.5 py-1.5 text-xs font-mono text-apoc-cyan focus:outline-none focus:border-apoc-cyan">
      </div>
    </div>
    <button onclick="executeJump()" class="w-full py-2 bg-apoc-cyan/20 border border-apoc-cyan/60 hover:bg-apoc-cyan/30 text-apoc-cyan font-orbitron text-xs font-bold rounded transition">
      LOCATE & PAN
    </button>
  </div>

  <!-- Live Coordinate Tracker Footer Bar -->
  <div class="absolute bottom-3 left-3 z-[1000] bg-apoc-panel/90 border border-apoc-border rounded-lg px-3 py-1.5 backdrop-blur-md flex items-center gap-3 font-mono text-xs shadow-lg">
    <div class="w-2 h-2 rounded-full bg-apoc-green animate-ping"></div>
    <span class="text-gray-400">CURSOR:</span>
    <span id="liveCoords" class="text-apoc-green font-bold tracking-widest">X: 000 | Y: 000</span>
  </div>

  <!-- Sidebar Drawer -->
  <div id="sidebar" class="absolute top-14 right-0 bottom-0 w-80 md:w-96 bg-apoc-panel/95 border-l border-apoc-border z-[1000] transition-transform duration-300 translate-x-full backdrop-blur-md flex flex-col shadow-2xl">
    
    <!-- Sidebar Header Tabs -->
    <div class="p-3 border-b border-apoc-border/80 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <button id="tabPoiBtn" onclick="switchSidebarTab('poi')" class="px-3 py-1 rounded bg-apoc-green/20 border border-apoc-green text-apoc-green font-orbitron text-xs font-bold transition">
          <i class="fa-solid fa-location-dot mr-1"></i> POI MARKERS
        </button>
        <button id="tabBoundsBtn" onclick="switchSidebarTab('bounds')" class="px-3 py-1 rounded bg-black/40 border border-apoc-border text-gray-400 hover:text-white font-orbitron text-xs font-bold transition">
          <i class="fa-solid fa-vector-square mr-1"></i> TERRITORIES
        </button>
      </div>
      <button onclick="toggleSidebar()" class="text-gray-400 hover:text-white p-1">
        <i class="fa-solid fa-xmark text-sm"></i>
      </button>
    </div>

    <!-- POI Tab Content -->
    <div id="tabPoiContent" class="flex-1 flex flex-col overflow-hidden">
      <div class="p-3 border-b border-apoc-border/60 bg-black/20">
        <div class="relative mb-2">
          <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-xs text-gray-500"></i>
          <input type="text" id="searchPins" onkeyup="filterSidebarPins()" placeholder="Search location or category..." class="w-full bg-black/60 border border-apoc-border rounded-lg pl-8 pr-3 py-1.5 text-xs text-gray-200 placeholder-gray-500 focus:outline-none focus:border-apoc-green font-sans">
        </div>
        <div class="flex items-center justify-between text-[11px] font-mono text-gray-400">
          <span id="pinCount">0 MARKERS FOUND</span>
          <button onclick="resetDemoData()" class="text-apoc-red hover:underline">RESET DEMO DATA</button>
        </div>
      </div>
      <div id="sidebarList" class="flex-1 overflow-y-auto p-3 space-y-2"></div>
    </div>

    <!-- Boundaries Tab Content -->
    <div id="tabBoundsContent" class="hidden flex-1 flex flex-col overflow-hidden">
      <div class="p-3 border-b border-apoc-border/60 bg-black/20 flex items-center justify-between">
        <span id="boundaryCount" class="text-[11px] font-mono text-gray-400">0 TERRITORIES DEFINED</span>
        <button onclick="toggleDrawMode()" class="px-2.5 py-1 bg-apoc-green/20 border border-apoc-green/60 text-apoc-green text-xs font-mono font-bold rounded hover:bg-apoc-green/30 transition">
          + DRAW NEW ZONE
        </button>
      </div>
      <div id="sidebarBoundaryList" class="flex-1 overflow-y-auto p-3 space-y-2"></div>
    </div>

    <!-- Sidebar Footer -->
    <div class="p-3 border-t border-apoc-border/80 bg-black/40 text-center">
      <p class="text-[11px] text-gray-400 font-sans">
        <i class="fa-solid fa-mouse-pointer text-apoc-green mr-1"></i> Click map to drop pin or draw territory polygon.
      </p>
    </div>
  </div>

  <!-- Leaflet JavaScript -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // Map Grid Configuration
    const MAP_SIZE = 1000;
    const bounds = [[0, 0], [MAP_SIZE, MAP_SIZE]];

    // Define Marker Categories
    const CATEGORIES = {
      safehouse: { name: "Safehouses", icon: "fa-shield-halved", color: "badge-safehouse", key: "safehouse" },
      loot: { name: "Loot & Supplies", icon: "fa-box-archive", color: "badge-loot", key: "loot" },
      boss: { name: "Bosses & Infection", icon: "fa-skull-crossbones", color: "badge-boss", key: "boss" },
      quest: { name: "Quests & Waypoints", icon: "fa-flag", color: "badge-quest", key: "quest" },
      custom: { name: "Custom User Pins", icon: "fa-location-dot", color: "badge-custom", key: "custom" }
    };

    // Boundary Preset Styles
    const BOUNDARY_PRESETS = {
      alliance: { name: "Alliance Territory", stroke: "#00e5ff", fill: "#00e5ff", fillOpacity: 0.25, strokeWidth: 2.5, dashArray: null },
      danger: { name: "Enemy / Danger Zone", stroke: "#ff3366", fill: "#ff3366", fillOpacity: 0.3, strokeWidth: 2.5, dashArray: null },
      infection: { name: "Quarantine / Infection", stroke: "#00ff9d", fill: "#00ff9d", fillOpacity: 0.35, strokeWidth: 2, dashArray: "6, 6" },
      resource: { name: "Resource Sector", stroke: "#ffcc00", fill: "#ffcc00", fillOpacity: 0.25, strokeWidth: 2, dashArray: null },
      neutral: { name: "Neutral Zone", stroke: "#ffffff", fill: "#888888", fillOpacity: 0.15, strokeWidth: 1.5, dashArray: "4, 4" }
    };

    // Initial Default Data
    const initialMarkers = [
      { id: 1, name: "Central Refuge", category: "safehouse", coords: [500, 500], desc: "Main fortified survivor sanctuary. Safe zone trading hub." },
      { id: 2, name: "West Outpost", category: "safehouse", coords: [300, 150], desc: "Small barricaded watchtower overlooking Western Wastes." },
      { id: 3, name: "Summit Shelter", category: "safehouse", coords: [850, 800], desc: "High-altitude bunker with radio backup power." },
      { id: 4, name: "Military Armory", category: "loot", coords: [720, 350], desc: "High-grade weapons and ammunition crates." },
      { id: 5, name: "Medical Depot", category: "loot", coords: [420, 780], desc: "Contains rare antibiotics and infection suppressor shots." },
      { id: 6, name: "Plague Abomination", category: "boss", coords: [800, 200], desc: "Extreme biological threat level. High radiation output." },
      { id: 7, name: "Radio Tower Alpha", category: "quest", coords: [900, 450], desc: "Repair transmission array to call for rescue drops." }
    ];

    const initialBoundaries = [
      {
        id: "b1",
        name: "Blood Hunters Territory",
        preset: "alliance",
        points: [[400, 400], [400, 650], [650, 650], [650, 400]],
        desc: "Primary claim held by the Blood Hunters Alliance syndicate."
      },
      {
        id: "b2",
        name: "Biohazard Hotspot Alpha",
        preset: "infection",
        points: [[700, 100], [750, 300], [900, 280], [850, 100]],
        desc: "Level 4 airborne pathogen contamination zone."
      }
    ];

    // 1. Initialize Map on Flat Simple CRS
    const map = L.map('map', {
      crs: L.CRS.Simple,
      minZoom: -1,
      maxZoom: 3,
      zoomControl: false,
      maxBounds: bounds,
      maxBoundsViscosity: 0.8
    });

    L.control.zoom({ position: 'bottomright' }).addTo(map);

    // Synthesize Tactical SVG Grid Background
    const svgMapBg = `
      <svg xmlns="http://www.w3.org/2000/svg" width="${MAP_SIZE}" height="${MAP_SIZE}" viewBox="0 0 ${MAP_SIZE} ${MAP_SIZE}">
        <rect width="${MAP_SIZE}" height="${MAP_SIZE}" fill="#0b0e11"/>
        <g stroke="#1a232c" stroke-width="2">
          ${Array.from({length: 10}, (_, i) => `<line x1="0" y1="${i*100}" x2="1000" y2="${i*100}"/><line x1="${i*100}" y1="0" x2="${i*100}" y2="1000"/>`).join('')}
        </g>
        <g stroke="#263545" stroke-width="1" stroke-dasharray="4,4">
          ${Array.from({length: 50}, (_, i) => `<line x1="0" y1="${i*20}" x2="1000" y2="${i*20}"/><line x1="${i*20}" y1="0" x2="${i*20}" y2="1000"/>`).join('')}
        </g>
        <text x="50" y="70" fill="#2a3d50" font-family="monospace" font-size="28" font-weight="bold">SECTOR A-1</text>
        <text x="550" y="70" fill="#2a3d50" font-family="monospace" font-size="28" font-weight="bold">SECTOR A-2</text>
        <text x="50" y="570" fill="#2a3d50" font-family="monospace" font-size="28" font-weight="bold">SECTOR B-1</text>
        <text x="550" y="570" fill="#2a3d50" font-family="monospace" font-size="28" font-weight="bold">SECTOR B-2</text>
        <circle cx="500" cy="500" r="180" fill="none" stroke="#ff3366" stroke-width="1.5" stroke-dasharray="6,6" opacity="0.25"/>
        <circle cx="500" cy="500" r="350" fill="none" stroke="#00ff9d" stroke-width="1" opacity="0.15"/>
      </svg>
    `;
    const mapBgUrl = 'data:image/svg+xml;base64,' + btoa(svgMapBg);
    
    const imageOverlay = L.imageOverlay('map.png', bounds, {
      errorCallback: function() { this.setUrl(mapBgUrl); }
    }).addTo(map);

    const testImg = new Image();
    testImg.src = 'map.png';
    testImg.onerror = () => imageOverlay.setUrl(mapBgUrl);

    map.fitBounds(bounds);

    // Grid Overlay Lines (100px)
    const gridLayer = L.layerGroup().addTo(map);
    for (let i = 0; i <= MAP_SIZE; i += 100) {
      L.polyline([[0, i], [MAP_SIZE, i]], {
        color: i % 500 === 0 ? 'rgba(0, 255, 157, 0.3)' : 'rgba(255, 255, 255, 0.08)',
        weight: i % 500 === 0 ? 1.5 : 0.8
      }).addTo(gridLayer);

      L.polyline([[i, 0], [i, MAP_SIZE]], {
        color: i % 500 === 0 ? 'rgba(0, 255, 157, 0.3)' : 'rgba(255, 255, 255, 0.08)',
        weight: i % 500 === 0 ? 1.5 : 0.8
      }).addTo(gridLayer);

      if (i > 0 && i < MAP_SIZE) {
        L.marker([15, i], {
          icon: L.divIcon({ className: 'text-[9px] font-mono text-gray-500 font-bold', html: `X:${i}`, iconSize: [40, 12] }),
          interactive: false
        }).addTo(gridLayer);

        L.marker([i, 15], {
          icon: L.divIcon({ className: 'text-[9px] font-mono text-gray-500 font-bold', html: `Y:${i}`, iconSize: [40, 12] }),
          interactive: false
        }).addTo(gridLayer);
      }
    }

    // Layer Groups
    const categoryLayers = {
      safehouse: L.layerGroup().addTo(map),
      loot: L.layerGroup().addTo(map),
      boss: L.layerGroup().addTo(map),
      quest: L.layerGroup().addTo(map),
      custom: L.layerGroup().addTo(map),
      boundaries: L.layerGroup().addTo(map)
    };

    const layerControls = {
      '<span class="text-apoc-green"><i class="fa-solid fa-shield-halved mr-1"></i> Safehouses</span>': categoryLayers.safehouse,
      '<span class="text-apoc-gold"><i class="fa-solid fa-box-archive mr-1"></i> Loot Caches</span>': categoryLayers.loot,
      '<span class="text-apoc-red"><i class="fa-solid fa-skull-crossbones mr-1"></i> Bosses & Infected</span>': categoryLayers.boss,
      '<span class="text-apoc-cyan"><i class="fa-solid fa-flag mr-1"></i> Quests & Waypoints</span>': categoryLayers.quest,
      '<span class="text-apoc-purple"><i class="fa-solid fa-location-dot mr-1"></i> Custom Pins</span>': categoryLayers.custom,
      '<span class="text-white"><i class="fa-solid fa-draw-polygon mr-1"></i> Territories & Zones</span>': categoryLayers.boundaries
    };

    L.control.layers(null, layerControls, { collapsed: false, position: 'topright' }).addTo(map);

    // Master State Storage
    let markersData = [...initialMarkers, ...JSON.parse(localStorage.getItem('last_asylum_custom_pins') || '[]')];
    let boundariesData = [...initialBoundaries, ...JSON.parse(localStorage.getItem('last_asylum_boundaries') || '[]')];

    function renderMarkers() {
      Object.keys(categoryLayers).forEach(k => { if (k !== 'boundaries') categoryLayers[k].clearLayers(); });

      markersData.forEach(item => {
        const cat = CATEGORIES[item.category] || CATEGORIES.custom;
        const icon = L.divIcon({
          className: '',
          html: `<div class="custom-badge ${cat.color}"><i class="fa-solid ${cat.icon}"></i></div>`,
          iconSize: [30, 30],
          iconAnchor: [15, 15]
        });

        const marker = L.marker(item.coords, { icon: icon });
        const popupHtml = `
          <div class="p-2 min-w-[200px]">
            <div class="flex items-center gap-2 mb-1">
              <span class="text-xs font-bold uppercase text-white font-orbitron">${item.name}</span>
            </div>
            <div class="inline-block px-2 py-0.5 rounded text-[10px] font-mono font-bold uppercase mb-2 ${cat.color} text-black">
              ${cat.name}
            </div>
            <p class="text-xs text-gray-300 mb-3 font-sans">${item.desc || 'No description provided.'}</p>
            <div class="flex items-center justify-between pt-2 border-t border-apoc-border text-[11px] font-mono">
              <span class="text-apoc-cyan">X: ${item.coords[1]} | Y: ${item.coords[0]}</span>
              <button onclick="copyCoords(${item.coords[1]}, ${item.coords[0]})" class="text-gray-400 hover:text-white">
                <i class="fa-regular fa-copy"></i> Copy
              </button>
            </div>
          </div>
        `;

        marker.bindPopup(popupHtml);
        const layer = categoryLayers[item.category] || categoryLayers.custom;
        marker.addTo(layer);
        item.leafletMarker = marker;
      });

      updateSidebarPOI();
    }

    // Render Boundaries
    function renderBoundaries() {
      categoryLayers.boundaries.clearLayers();

      boundariesData.forEach(b => {
        const preset = BOUNDARY_PRESETS[b.preset] || BOUNDARY_PRESETS.neutral;
        
        const polygon = L.polygon(b.points, {
          color: preset.stroke,
          fillColor: preset.fill,
          fillOpacity: preset.fillOpacity,
          weight: preset.strokeWidth,
          dashArray: preset.dashArray
        });

        // Compute Bounding Box Coordinates for Tooltip / Popup
        const lats = b.points.map(p => p[0]);
        const lngs = b.points.map(p => p[1]);
        const minY = Math.min(...lats), maxY = Math.max(...lats);
        const minX = Math.min(...lngs), maxX = Math.max(...lngs);

        polygon.bindTooltip(`<b>${b.name}</b><br>Preset: ${preset.name}`, { className: 'tactical-tooltip', sticky: true });

        const popupHtml = `
          <div class="p-2 min-w-[210px] font-sans">
            <div class="flex items-center justify-between mb-1">
              <span class="font-orbitron font-bold text-xs text-white">${b.name}</span>
            </div>
            <div class="inline-block px-2 py-0.5 rounded text-[10px] font-mono font-bold uppercase mb-2" style="background:${preset.stroke}; color:#000;">
              ${preset.name}
            </div>
            <p class="text-xs text-gray-300 mb-2">${b.desc || 'Tactical territory zone.'}</p>
            <div class="text-[10px] font-mono text-gray-400 border-t border-apoc-border pt-2 mb-2">
              BOUNDS: X[${minX}-${maxX}] | Y[${minY}-${maxY}]
            </div>
            <div class="flex gap-2">
              <button onclick="deleteBoundary('${b.id}')" class="w-full py-1 bg-apoc-red/20 border border-apoc-red/60 text-apoc-red text-xs font-mono font-bold rounded hover:bg-apoc-red/30">
                DELETE ZONE
              </button>
            </div>
          </div>
        `;

        polygon.bindPopup(popupHtml);
        polygon.addTo(categoryLayers.boundaries);
        b.leafletPoly = polygon;
      });

      updateSidebarBoundaries();
    }

    // Interactive Polygon Drawing System State
    let isDrawing = false;
    let currentDrawingPoints = [];
    let currentPolyline = null;
    let tempVertexMarkers = [];

    function toggleDrawMode() {
      if (isDrawing) {
        cancelDrawing();
      } else {
        isDrawing = true;
        currentDrawingPoints = [];
        document.getElementById('map').classList.add('drawing-active');
        document.getElementById('drawHud').classList.remove('hidden');
        document.getElementById('drawModeBtn').classList.add('border-apoc-green', 'bg-apoc-green/20');
      }
    }

    function updateDrawingPreset() {
      if (currentPolyline) {
        const presetKey = document.getElementById('drawPresetSelect').value;
        const p = BOUNDARY_PRESETS[presetKey];
        currentPolyline.setStyle({ color: p.stroke });
      }
    }

    map.on('click', function(e) {
      if (isDrawing) {
        const x = Math.round(e.latlng.lng);
        const y = Math.round(e.latlng.lat);
        currentDrawingPoints.push([y, x]);

        // Vertex Marker
        const vertexIcon = L.divIcon({
          className: '',
          html: `<div class="custom-badge badge-vertex"><i class="fa-solid fa-circle text-[8px]"></i></div>`,
          iconSize: [16, 16],
          iconAnchor: [8, 8]
        });
        const vm = L.marker([y, x], { icon: vertexIcon }).addTo(map);
        tempVertexMarkers.push(vm);

        // Update Drawing Guide Polyline
        const presetKey = document.getElementById('drawPresetSelect').value;
        const p = BOUNDARY_PRESETS[presetKey];

        if (currentPolyline) {
          currentPolyline.setLatLngs(currentDrawingPoints);
        } else {
          currentPolyline = L.polyline(currentDrawingPoints, { color: p.stroke, weight: 2, dashArray: '4, 4' }).addTo(map);
        }
      } else {
        // Normal Pin Drop Handler
        handleMapPinDrop(e);
      }
    });

    // Double-click to finish drawing polygon
    map.on('dblclick', function(e) {
      if (isDrawing) {
        L.DomEvent.stopPropagation(e);
        finishPolygonDrawing();
      }
    });

    function finishPolygonDrawing() {
      if (currentDrawingPoints.length < 3) {
        alert("A boundary polygon requires at least 3 vertex points!");
        return;
      }

      const presetKey = document.getElementById('drawPresetSelect').value;
      const zoneName = prompt("Enter Zone / Territory Title:", "Sector Territory Zone");
      if (!zoneName) {
        cancelDrawing();
        return;
      }

      const newBoundary = {
        id: "b_" + Date.now(),
        name: zoneName,
        preset: presetKey,
        points: [...currentDrawingPoints],
        desc: "Custom created boundary zone."
      };

      boundariesData.push(newBoundary);
      
      // Save to localStorage
      const customBounds = JSON.parse(localStorage.getItem('last_asylum_boundaries') || '[]');
      customBounds.push(newBoundary);
      localStorage.setItem('last_asylum_boundaries', JSON.stringify(customBounds));

      cancelDrawing();
      renderBoundaries();
    }

    function cancelDrawing() {
      isDrawing = false;
      currentDrawingPoints = [];
      document.getElementById('map').classList.remove('drawing-active');
      document.getElementById('drawHud').classList.add('hidden');
      document.getElementById('drawModeBtn').classList.remove('border-apoc-green', 'bg-apoc-green/20');

      if (currentPolyline) map.removeLayer(currentPolyline);
      currentPolyline = null;

      tempVertexMarkers.forEach(m => map.removeLayer(m));
      tempVertexMarkers = [];
    }

    function deleteBoundary(id) {
      boundariesData = boundariesData.filter(b => b.id !== id);
      
      // Update LocalStorage
      const customBounds = JSON.parse(localStorage.getItem('last_asylum_boundaries') || '[]').filter(b => b.id !== id);
      localStorage.setItem('last_asylum_boundaries', JSON.stringify(customBounds));

      renderBoundaries();
    }

    let tempMarker = null;

    function handleMapPinDrop(e) {
      const x = Math.round(e.latlng.lng);
      const y = Math.round(e.latlng.lat);

      if (tempMarker) map.removeLayer(tempMarker);

      const tempIcon = L.divIcon({
        className: '',
        html: `<div class="custom-badge badge-custom animate-bounce"><i class="fa-solid fa-plus"></i></div>`,
        iconSize: [30, 30],
        iconAnchor: [15, 15]
      });

      tempMarker = L.marker([y, x], { icon: tempIcon }).addTo(map);

      const popupForm = `
        <div class="p-2 w-64 font-sans">
          <div class="font-orbitron font-bold text-xs text-apoc-green mb-2 flex items-center justify-between">
            <span>NEW LOCATION MARKER</span>
            <span class="text-gray-400 font-mono">X:${x} Y:${y}</span>
          </div>
          <div class="space-y-2 mb-3">
            <div>
              <label class="block text-[10px] text-gray-400 font-mono mb-0.5">LOCATION TITLE</label>
              <input type="text" id="newPinName" placeholder="e.g. Hidden Stash" class="w-full bg-black/60 border border-apoc-border rounded px-2 py-1 text-xs text-white focus:outline-none focus:border-apoc-green">
            </div>
            <div>
              <label class="block text-[10px] text-gray-400 font-mono mb-0.5">CATEGORY</label>
              <select id="newPinCat" class="w-full bg-black/60 border border-apoc-border rounded px-2 py-1 text-xs text-white focus:outline-none focus:border-apoc-green">
                <option value="safehouse">Safehouse</option>
                <option value="loot">Loot & Supplies</option>
                <option value="boss">Boss / Danger Zone</option>
                <option value="quest">Quest / Waypoint</option>
                <option value="custom" selected>Custom Pin</option>
              </select>
            </div>
            <div>
              <label class="block text-[10px] text-gray-400 font-mono mb-0.5">NOTES</label>
              <textarea id="newPinDesc" rows="2" placeholder="Tactical notes..." class="w-full bg-black/60 border border-apoc-border rounded px-2 py-1 text-xs text-white focus:outline-none focus:border-apoc-green"></textarea>
            </div>
          </div>
          <div class="flex gap-2">
            <button onclick="saveCustomPin(${x}, ${y})" class="flex-1 py-1.5 bg-apoc-green/20 border border-apoc-green/60 hover:bg-apoc-green/30 text-apoc-green font-bold text-xs rounded transition">
              SAVE PIN
            </button>
            <button onclick="copyCoords(${x}, ${y})" class="px-3 py-1.5 bg-gray-800 border border-gray-700 hover:bg-gray-700 text-gray-300 text-xs rounded">
              <i class="fa-regular fa-copy"></i>
            </button>
          </div>
        </div>
      `;

      tempMarker.bindPopup(popupForm).openPopup();
    }

    window.saveCustomPin = function(x, y) {
      const name = document.getElementById('newPinName').value.trim() || `Pin [X:${x}, Y:${y}]`;
      const category = document.getElementById('newPinCat').value;
      const desc = document.getElementById('newPinDesc').value.trim();

      const newPin = { id: Date.now(), name, category, coords: [y, x], desc };
      markersData.push(newPin);

      const savedCustom = JSON.parse(localStorage.getItem('last_asylum_custom_pins') || '[]');
      savedCustom.push(newPin);
      localStorage.setItem('last_asylum_custom_pins', JSON.stringify(savedCustom));

      if (tempMarker) map.removeLayer(tempMarker);
      renderMarkers();

      map.panTo([y, x]);
      setTimeout(() => { if (newPin.leafletMarker) newPin.leafletMarker.openPopup(); }, 300);
    };

    // Live Cursor Coordinate Tracking
    const liveCoordsDiv = document.getElementById('liveCoords');
    map.on('mousemove', function(e) {
      const x = Math.max(0, Math.min(MAP_SIZE, Math.round(e.latlng.lng)));
      const y = Math.max(0, Math.min(MAP_SIZE, Math.round(e.latlng.lat)));
      liveCoordsDiv.innerText = `X: ${String(x).padStart(3, '0')} | Y: ${String(y).padStart(3, '0')}`;
    });

    window.toggleJumpWidget = function() {
      document.getElementById('jumpWidget').classList.toggle('hidden');
    };

    window.executeJump = function() {
      const x = parseInt(document.getElementById('jumpX').value);
      const y = parseInt(document.getElementById('jumpY').value);

      if (isNaN(x) || isNaN(y) || x < 0 || x > MAP_SIZE || y < 0 || y > MAP_SIZE) {
        alert(`Please enter valid coordinates between 0 and ${MAP_SIZE}`);
        return;
      }

      map.flyTo([y, x], 2, { duration: 1.2 });
      toggleJumpWidget();
    };

    window.copyCoords = function(x, y) {
      const text = `[${y}, ${x}]`;
      navigator.clipboard.writeText(text);
      
      const toast = document.createElement('div');
      toast.className = 'fixed bottom-12 right-4 z-[2000] bg-apoc-green text-black font-mono font-bold text-xs px-3 py-2 rounded shadow-xl';
      toast.innerText = `COORDINATES COPIED: ${text}`;
      document.body.appendChild(toast);
      setTimeout(() => toast.remove(), 2000);
    };

    window.toggleSidebar = function() {
      document.getElementById('sidebar').classList.toggle('translate-x-full');
    };

    window.switchSidebarTab = function(tab) {
      const poiBtn = document.getElementById('tabPoiBtn');
      const boundsBtn = document.getElementById('tabBoundsBtn');
      const poiContent = document.getElementById('tabPoiContent');
      const boundsContent = document.getElementById('tabBoundsContent');

      if (tab === 'poi') {
        poiBtn.className = 'px-3 py-1 rounded bg-apoc-green/20 border border-apoc-green text-apoc-green font-orbitron text-xs font-bold transition';
        boundsBtn.className = 'px-3 py-1 rounded bg-black/40 border border-apoc-border text-gray-400 hover:text-white font-orbitron text-xs font-bold transition';
        poiContent.classList.remove('hidden');
        boundsContent.classList.add('hidden');
      } else {
        boundsBtn.className = 'px-3 py-1 rounded bg-apoc-green/20 border border-apoc-green text-apoc-green font-orbitron text-xs font-bold transition';
        poiBtn.className = 'px-3 py-1 rounded bg-black/40 border border-apoc-border text-gray-400 hover:text-white font-orbitron text-xs font-bold transition';
        boundsContent.classList.remove('hidden');
        poiContent.classList.add('hidden');
      }
    };

    function updateSidebarPOI() {
      const list = document.getElementById('sidebarList');
      const searchVal = (document.getElementById('searchPins').value || '').toLowerCase();
      list.innerHTML = '';

      const filtered = markersData.filter(m => 
        m.name.toLowerCase().includes(searchVal) || m.category.toLowerCase().includes(searchVal)
      );

      document.getElementById('pinCount').innerText = `${filtered.length} MARKERS FOUND`;

      filtered.forEach(item => {
        const cat = CATEGORIES[item.category] || CATEGORIES.custom;
        const card = document.createElement('div');
        card.className = 'p-3 rounded-lg bg-black/40 border border-apoc-border hover:border-apoc-green/50 cursor-pointer transition flex items-center justify-between group';
        card.onclick = () => {
          map.flyTo(item.coords, 2, { duration: 1 });
          if (item.leafletMarker) item.leafletMarker.openPopup();
          if (window.innerWidth < 768) toggleSidebar();
        };

        card.innerHTML = `
          <div class="flex items-center gap-3">
            <div class="w-7 h-7 rounded-full ${cat.color} flex items-center justify-center text-xs text-black font-bold shrink-0">
              <i class="fa-solid ${cat.icon}"></i>
            </div>
            <div>
              <h4 class="text-xs font-bold text-gray-200 group-hover:text-apoc-green transition">${item.name}</h4>
              <p class="text-[10px] text-gray-400 font-mono">X: ${item.coords[1]} | Y: ${item.coords[0]}</p>
            </div>
          </div>
          <i class="fa-solid fa-chevron-right text-xs text-gray-600 group-hover:text-apoc-green"></i>
        `;
        list.appendChild(card);
      });
    }

    function updateSidebarBoundaries() {
      const list = document.getElementById('sidebarBoundaryList');
      list.innerHTML = '';

      document.getElementById('boundaryCount').innerText = `${boundariesData.length} TERRITORIES DEFINED`;

      boundariesData.forEach(b => {
        const preset = BOUNDARY_PRESETS[b.preset] || BOUNDARY_PRESETS.neutral;
        const card = document.createElement('div');
        card.className = 'p-3 rounded-lg bg-black/40 border border-apoc-border hover:border-apoc-green/50 transition flex items-center justify-between group';
        
        card.innerHTML = `
          <div class="cursor-pointer flex-1" onclick="focusBoundary('${b.id}')">
            <div class="flex items-center gap-2 mb-1">
              <span class="w-2.5 h-2.5 rounded-full" style="background:${preset.stroke}"></span>
              <h4 class="text-xs font-bold text-gray-200 group-hover:text-apoc-green font-orbitron">${b.name}</h4>
            </div>
            <p class="text-[10px] text-gray-400 font-mono uppercase">${preset.name}</p>
          </div>
          <button onclick="deleteBoundary('${b.id}')" class="text-gray-500 hover:text-apoc-red p-1">
            <i class="fa-solid fa-trash-can text-xs"></i>
          </button>
        `;
        list.appendChild(card);
      });
    }

    window.focusBoundary = function(id) {
      const b = boundariesData.find(x => x.id === id);
      if (b && b.leafletPoly) {
        map.fitBounds(b.leafletPoly.getBounds());
        b.leafletPoly.openPopup();
        if (window.innerWidth < 768) toggleSidebar();
      }
    };

    window.filterSidebarPins = function() {
      updateSidebarPOI();
    };

    window.resetDemoData = function() {
      if (confirm("Reset all custom markers and boundaries back to default demo state?")) {
        localStorage.removeItem('last_asylum_custom_pins');
        localStorage.removeItem('last_asylum_boundaries');
        markersData = [...initialMarkers];
        boundariesData = [...initialBoundaries];
        renderMarkers();
        renderBoundaries();
      }
    };

    // Initial Execution
    renderMarkers();
    renderBoundaries();
  </script>
</body>
</html>
