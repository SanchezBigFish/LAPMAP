<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Last Asylum: Plague - Tactical Command Map</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  
  <style>
    :root {
      --bg-dark: #0a0c10;
      --panel-bg: rgba(13, 17, 23, 0.94);
      --border-color: rgba(0, 255, 204, 0.25);
      --text-main: #e6edf3;
      --accent-cyan: #00ffcc;
      --accent-red: #ff3366;
      --accent-gold: #ffcc00;
      --accent-purple: #9933ff;
      --font-mono: 'JetBrains Mono', 'Courier New', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: var(--bg-dark); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: var(--text-main); }

    /* Pixel crisp rendering for deep zoom without blurring */
    #map { width: 100vw; height: 100vh; background: #050608; }
    .leaflet-tile-container img, .leaflet-image-layer {
      image-rendering: -webkit-optimize-contrast;
      image-rendering: crisp-edges;
      image-rendering: pixelated;
    }

    /* Top Navigation Bar */
    .top-bar {
      position: absolute; top: 12px; left: 12px; right: 12px; z-index: 1000;
      display: flex; gap: 8px; align-items: center; justify-content: space-between;
      pointer-events: none;
    }
    .top-group { display: flex; gap: 8px; pointer-events: auto; flex-wrap: wrap; }

    .btn {
      background: var(--panel-bg); border: 1px solid var(--border-color); color: var(--accent-cyan);
      padding: 8px 14px; font-size: 12px; font-family: var(--font-mono); border-radius: 4px;
      cursor: pointer; backdrop-filter: blur(8px); display: flex; align-items: center; gap: 6px;
      transition: all 0.2s ease;
    }
    .btn:hover { background: rgba(0, 255, 204, 0.15); border-color: var(--accent-cyan); box-shadow: 0 0 10px rgba(0,255,204,0.3); }
    .btn.active { background: var(--accent-cyan); color: #000; font-weight: bold; }
    .btn-danger { color: var(--accent-red); border-color: rgba(255, 51, 102, 0.3); }
    .btn-danger:hover { background: rgba(255, 51, 102, 0.2); border-color: var(--accent-red); }

    /* HUD Controls & Coordinates Bar */
    .hud-bar {
      position: absolute; bottom: 12px; left: 12px; z-index: 1000;
      background: var(--panel-bg); border: 1px solid var(--border-color);
      padding: 6px 14px; font-family: var(--font-mono); font-size: 13px;
      color: var(--accent-cyan); border-radius: 4px; backdrop-filter: blur(8px);
      pointer-events: auto; display: flex; gap: 12px; align-items: center;
    }

    /* Side Control Panels */
    .side-panel {
      position: absolute; top: 60px; right: 12px; bottom: 50px; width: 350px; z-index: 1000;
      background: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 6px;
      backdrop-filter: blur(12px); display: flex; flex-direction: column; overflow: hidden;
      box-shadow: 0 8px 32px rgba(0,0,0,0.8); transition: transform 0.3s ease;
    }
    .side-panel.collapsed { transform: translateX(370px); }

    .panel-header {
      padding: 12px 16px; border-bottom: 1px solid var(--border-color);
      display: flex; justify-content: space-between; align-items: center;
      background: rgba(0, 255, 204, 0.05);
    }
    .panel-header h3 { font-family: var(--font-mono); font-size: 13px; text-transform: uppercase; letter-spacing: 1px; color: var(--accent-cyan); }
    .panel-body { padding: 16px; overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 14px; }

    .input-group { display: flex; flex-direction: column; gap: 6px; }
    .input-group label { font-size: 11px; font-family: var(--font-mono); color: #8b949e; text-transform: uppercase; }
    .input-row { display: flex; gap: 8px; }
    
    input, select, textarea {
      background: rgba(0,0,0,0.5); border: 1px solid var(--border-color); color: var(--text-main);
      padding: 8px; font-family: var(--font-mono); font-size: 12px; border-radius: 4px; width: 100%;
    }
    input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent-cyan); }

    .list-item {
      background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08);
      border-radius: 4px; padding: 8px 10px; display: flex; justify-content: space-between; align-items: center;
    }
    .list-item:hover { border-color: var(--border-color); background: rgba(0,255,204,0.05); }
    .list-info { font-family: var(--font-mono); font-size: 12px; }

    /* Custom Right-Click Context Menu */
    .context-menu {
      position: absolute; z-index: 3000; background: var(--panel-bg);
      border: 1px solid var(--accent-cyan); border-radius: 6px; padding: 6px;
      display: none; flex-direction: column; gap: 4px; min-width: 180px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.9); backdrop-filter: blur(12px);
    }
    .context-menu-item {
      padding: 8px 12px; font-family: var(--font-mono); font-size: 12px;
      color: var(--text-main); cursor: pointer; border-radius: 4px;
      display: flex; align-items: center; gap: 8px;
    }
    .context-menu-item:hover { background: rgba(0,255,204,0.2); color: var(--accent-cyan); }

    /* Modal Overlay */
    .modal {
      position: fixed; inset: 0; z-index: 2000; background: rgba(0,0,0,0.8);
      display: none; justify-content: center; align-items: center; backdrop-filter: blur(4px);
    }
    .modal.active { display: flex; }
    .modal-content {
      background: var(--bg-dark); border: 1px solid var(--accent-cyan); border-radius: 8px;
      width: 480px; max-width: 90vw; padding: 20px; display: flex; flex-direction: column; gap: 16px;
      box-shadow: 0 0 20px rgba(0,255,204,0.2);
    }

    /* Animated Motion Path Stroke */
    @keyframes dash { to { stroke-dashoffset: -40; } }
    .animated-path { stroke-dasharray: 10, 10; animation: dash 1.5s linear infinite; }

    /* City Level Badges */
    .lvl-badge {
      display: inline-block; padding: 1px 5px; font-size: 10px; font-family: var(--font-mono);
      font-weight: bold; border-radius: 3px; margin-right: 4px;
    }
    .lvl-7 { background: #ff0055; color: #fff; }
    .lvl-6 { background: #ff6600; color: #fff; }
    .lvl-5 { background: #9900ff; color: #fff; }
    .lvl-4 { background: #0099ff; color: #fff; }
    .lvl-3 { background: #00cc66; color: #fff; }
    .lvl-2 { background: #cccc00; color: #000; }
    .lvl-1 { background: #888888; color: #fff; }
  </style>
</head>
<body>

<div id="map"></div>

<!-- Top Navigation Bar -->
<div class="top-bar">
  <div class="top-group">
    <button class="btn" id="btn-box-select" onclick="toggleBoxSelect()"><i class="fa-solid fa-vector-square"></i> Box Select Mode</button>
    <button class="btn" onclick="togglePanel('cities')"><i class="fa-solid fa-city"></i> Cities (84)</button>
    <button class="btn" onclick="togglePanel('annotations')"><i class="fa-solid fa-note-sticky"></i> Sector Notes</button>
    <button class="btn" onclick="togglePanel('plotter')"><i class="fa-solid fa-route"></i> Path Plotter</button>
    <button class="btn" onclick="togglePanel('boundaries')"><i class="fa-solid fa-draw-polygon"></i> Territories</button>
  </div>
  <div class="top-group">
    <select id="filter-level" onchange="filterCitiesByLevel(this.value)" style="width: auto; height: 32px; background: var(--panel-bg); color: var(--accent-cyan); border-color: var(--border-color);">
      <option value="all">All Levels (1-7)</option>
      <option value="7">Lvl 7 (Royal City)</option>
      <option value="6">Lvl 6 (Fortresses)</option>
      <option value="5">Lvl 5 (Temples)</option>
      <option value="4">Lvl 4 Cities</option>
      <option value="3">Lvl 3 Cities</option>
      <option value="2">Lvl 2 Towns</option>
      <option value="1">Lvl 1 Outposts</option>
    </select>
    <button class="btn" onclick="openDataModal()"><i class="fa-solid fa-share-nodes"></i> Export / Import</button>
  </div>
</div>

<!-- Bottom Coordinate Tracker HUD -->
<div class="hud-bar" id="hud-coords">
  <span id="coords-text">X: 000 | Y: 000</span>
  <span id="selection-summary" style="color:var(--accent-gold); display:none;"></span>
</div>

<!-- RIGHT-CLICK CONTEXT MENU -->
<div class="context-menu" id="context-menu">
  <div class="context-menu-item" onclick="openDetailModal()"><i class="fa-solid fa-pen-to-square"></i> Add Detail / Notes</div>
  <div class="context-menu-item" onclick="copyContextCoords()"><i class="fa-solid fa-copy"></i> Copy Coordinates</div>
  <div class="context-menu-item" onclick="clearCurrentSelection()"><i class="fa-solid fa-xmark"></i> Clear Selection</div>
</div>

<!-- SIDE PANEL: CITY DIRECTORY -->
<div class="side-panel collapsed" id="panel-cities">
  <div class="panel-header">
    <h3><i class="fa-solid fa-city"></i> City Directory (84)</h3>
    <button class="btn btn-danger" onclick="closePanels()"><i class="fa-solid fa-xmark"></i></button>
  </div>
  <div class="panel-body">
    <div class="input-group">
      <input type="text" id="search-city" placeholder="Search city name..." onkeyup="searchCities(this.value)" />
    </div>
    <div id="city-directory-list" style="display:flex; flex-direction:column; gap:6px;"></div>
  </div>
</div>

<!-- SIDE PANEL: ANNOTATIONS / SECTOR NOTES -->
<div class="side-panel collapsed" id="panel-annotations">
  <div class="panel-header">
    <h3><i class="fa-solid fa-note-sticky"></i> Sector Notes & Highlights</h3>
    <button class="btn btn-danger" onclick="closePanels()"><i class="fa-solid fa-xmark"></i></button>
  </div>
  <div class="panel-body">
    <div id="annotations-list" style="display:flex; flex-direction:column; gap:8px;"></div>
  </div>
</div>

<!-- SIDE PANEL: TACTICAL PATH PLOTTER -->
<div class="side-panel collapsed" id="panel-plotter">
  <div class="panel-header">
    <h3><i class="fa-solid fa-route"></i> Path Plotter</h3>
    <button class="btn btn-danger" onclick="closePanels()"><i class="fa-solid fa-xmark"></i></button>
  </div>
  <div class="panel-body">
    <div class="input-group">
      <label>Plotting Mode</label>
      <div class="input-row">
        <button class="btn" id="btn-draw-path" onclick="togglePathDrawing()" style="flex:1;">
          <i class="fa-solid fa-pen-nib"></i> Click-to-Plot
        </button>
        <button class="btn btn-danger" onclick="clearCurrentPath()"><i class="fa-solid fa-trash"></i> Reset</button>
      </div>
    </div>
    <div class="input-group">
      <label>Path Label & Color</label>
      <input type="text" id="path-name" placeholder="e.g. Squad March Vector" value="Patrol Vector" />
      <div class="input-row">
        <input type="color" id="path-color" value="#00ffcc" style="height:36px; cursor:pointer;" />
        <select id="path-style">
          <option value="solid">Solid Line</option>
          <option value="animated">Animated March Vector</option>
        </select>
      </div>
    </div>
    <button class="btn" onclick="saveActivePath()" style="background:var(--accent-cyan); color:#000; font-weight:bold;">
      <i class="fa-solid fa-floppy-disk"></i> Save Path
    </button>
    <div class="input-group" style="border-top:1px solid var(--border-color); padding-top:12px;">
      <label>Saved Tactical Paths</label>
      <div id="saved-paths-list" style="display:flex; flex-direction:column; gap:6px;"></div>
    </div>
  </div>
</div>

<!-- SIDE PANEL: TERRITORY BOUNDARIES -->
<div class="side-panel collapsed" id="panel-boundaries">
  <div class="panel-header">
    <h3><i class="fa-solid fa-draw-polygon"></i> Territories</h3>
    <button class="btn btn-danger" onclick="closePanels()"><i class="fa-solid fa-xmark"></i></button>
  </div>
  <div class="panel-body">
    <div class="input-row">
      <button class="btn" id="btn-draw-poly" onclick="togglePolyDrawing()" style="flex:1;">
        <i class="fa-solid fa-draw-polygon"></i> Draw Sector
      </button>
      <button class="btn btn-danger" onclick="clearActivePoly()"><i class="fa-solid fa-trash"></i> Clear</button>
    </div>
    <div class="input-group">
      <label>Zone Name & Color</label>
      <input type="text" id="zone-name" placeholder="Alliance Sector" value="Alliance Sector" />
      <input type="color" id="zone-color" value="#00ffcc" style="height:36px; cursor:pointer;" />
    </div>
    <button class="btn" onclick="saveActiveZone()" style="background:var(--accent-cyan); color:#000; font-weight:bold;">
      <i class="fa-solid fa-floppy-disk"></i> Save Zone
    </button>
    <div id="saved-zones-list" style="display:flex; flex-direction:column; gap:6px; margin-top:12px;"></div>
  </div>
</div>

<!-- DETAIL / NOTE MODAL -->
<div class="modal" id="detail-modal">
  <div class="modal-content">
    <h3 style="font-family:var(--font-mono); color:var(--accent-cyan);"><i class="fa-solid fa-pen-to-square"></i> Add Sector Details / Notes</h3>
    <div class="input-group">
      <label>Title / Label</label>
      <input type="text" id="detail-title" placeholder="e.g. Alliance Staging Area" />
    </div>
    <div class="input-group">
      <label>Highlight Color</label>
      <input type="color" id="detail-color" value="#ffcc00" style="height:38px; cursor:pointer;" />
    </div>
    <div class="input-group">
      <label>Detailed Notes & Intelligence</label>
      <textarea id="detail-notes" rows="4" placeholder="Enter tactical information, squad assignments, or resource counts..."></textarea>
    </div>
    <div class="input-row">
      <button class="btn" onclick="saveDetailNote()" style="flex:1; background:var(--accent-cyan); color:#000; font-weight:bold;">Save Notes</button>
      <button class="btn btn-danger" onclick="closeDetailModal()" style="flex:1;">Cancel</button>
    </div>
  </div>
</div>

<!-- EXPORT / IMPORT MODAL -->
<div class="modal" id="data-modal">
  <div class="modal-content">
    <h3 style="font-family:var(--font-mono); color:var(--accent-cyan);"><i class="fa-solid fa-share-nodes"></i> Alliance Data Hub</h3>
    <p style="font-size:12px; color:#8b949e;">Share your custom paths, boundaries, and sector notes with alliance members.</p>
    <div class="input-group">
      <label>Quick Clipboard Sync</label>
      <div class="input-row">
        <button class="btn" onclick="copyDataToClipboard()" style="flex:1;"><i class="fa-solid fa-copy"></i> Copy Data Code</button>
        <button class="btn" onclick="pasteDataFromClipboard()" style="flex:1;"><i class="fa-solid fa-paste"></i> Paste & Load</button>
      </div>
    </div>
    <div class="input-group">
      <label>File Export / Import</label>
      <div class="input-row">
        <button class="btn" onclick="exportJSONFile()" style="flex:1;"><i class="fa-solid fa-download"></i> Download JSON</button>
        <input type="file" id="file-import" accept=".json" onchange="importJSONFile(event)" style="display:none;" />
        <button class="btn" onclick="document.getElementById('file-import').click()" style="flex:1;"><i class="fa-solid fa-upload"></i> Upload JSON</button>
      </div>
    </div>
    <button class="btn btn-danger" onclick="closeDataModal()" style="margin-top:8px;">Close</button>
  </div>
</div>

  // --- MAP CONFIGURATION ---

    maxZoom: 7, // High max zoom allows 10x10 square to fill the screen

    maxBounds: bounds,
    attributionControl: false

  map.fitBounds(bounds);

  // --- CRISP FAINT WHITE 1x1 TILES & HEAVY WHITE 5x5 GRID LINES ---

    const isMajor = (i % 5 === 0);

      color: isMajor ? 'rgba(255, 255, 255, 0.5)' : 'rgba(255, 255, 255, 0.15)',
      weight: isMajor ? 1.8 : 0.5,
      interactive: false
    };
    L.polyline([[0, i], [MAP_SIZE, i]], lineStyle).addTo(map);
    L.polyline([[i, 0], [i, MAP_SIZE]], lineStyle).addTo(map);
  }

  // --- STATE STORAGE ---
  let state = {
    zones: JSON.parse(localStorage.getItem('asylum_zones')) || [],
    paths: JSON.parse(localStorage.getItem('asylum_paths')) || [],
    annotations: JSON.parse(localStorage.getItem('asylum_annotations')) || []
  };

  function saveState() {
    localStorage.setItem('asylum_zones', JSON.stringify(state.zones));
    localStorage.setItem('asylum_paths', JSON.stringify(state.paths));
    localStorage.setItem('asylum_annotations', JSON.stringify(state.annotations));
    renderAll();
  }

  // --- HUD TRACKER ---
  const hudCoords = document.getElementById('coords-text');
  map.on('mousemove', function(e) {
    const x = Math.round(e.latlng.lng);
    const y = Math.round(e.latlng.lat);
    hudCoords.innerText = `X: ${x.toString().padStart(3,'0')} | Y: ${y.toString().padStart(3,'0')}`;
  });

  // --- CLICK & DRAG MULTI-TILE BOX SELECTOR WITH STRICT INTEGER GRID SNAPPING ---
  let isBoxSelect = false;
  let isDraggingSelect = false;
  let dragStartLatLng = null;
  let activeSelectionLayer = L.layerGroup().addTo(map);
  let activeSelectionBounds = null;

  function toggleBoxSelect() {
    isBoxSelect = !isBoxSelect;
    document.getElementById('btn-box-select').classList.toggle('active', isBoxSelect);
    map.getContainer().style.cursor = isBoxSelect ? 'crosshair' : '';
    if (isBoxSelect) map.dragging.disable();
    else map.dragging.enable();
  }

  map.on('mousedown', function(e) {
    if (isBoxSelect || e.originalEvent.shiftKey) {
      isDraggingSelect = true;
      dragStartLatLng = e.latlng;
      map.dragging.disable();
    }
  });

  map.on('mousemove', function(e) {
    if (!isDraggingSelect || !dragStartLatLng) return;
    
    // Calculate strict integer tile boundaries (snapped to whole 1x1 grid lines)
    const rawX1 = Math.round(dragStartLatLng.lng);
    const rawX2 = Math.round(e.latlng.lng);
    const rawY1 = Math.round(dragStartLatLng.lat);
    const rawY2 = Math.round(e.latlng.lat);

    const x1 = Math.min(rawX1, rawX2);
    const x2 = Math.max(rawX1, rawX2);
    const y1 = Math.min(rawY1, rawY2);
    const y2 = Math.max(rawY1, rawY2);

    // Bounds snap strictly to integer tile grid intersections
    activeSelectionBounds = [[y1, x1], [y2, x2]];
    
    activeSelectionLayer.clearLayers();
    L.rectangle(activeSelectionBounds, {
      color: '#00ffcc', weight: 2, fillColor: '#00ffcc', fillOpacity: 0.35, interactive: false
    }).addTo(activeSelectionLayer);

    const tileWidth = Math.abs(x2 - x1);
    const tileHeight = Math.abs(y2 - y1);
    const tileCount = Math.max(1, tileWidth * tileHeight);

    const summary = document.getElementById('selection-summary');
    summary.style.display = 'inline';
    summary.innerText = `[Selection: X:${x1}-${x2}, Y:${y1}-${y2} (${tileCount} Tiles)]`;
  });

  map.on('mouseup', function(e) {
    if (isDraggingSelect) {
      isDraggingSelect = false;
      if (!isBoxSelect) map.dragging.enable();
    }
  });

  function clearCurrentSelection() {
    activeSelectionBounds = null;
    activeSelectionLayer.clearLayers();
    document.getElementById('selection-summary').style.display = 'none';
    hideContextMenu();
  }

  // --- RIGHT CLICK CONTEXT MENU ---
  const contextMenu = document.getElementById('context-menu');
  let contextCoords = null;

  map.on('contextmenu', function(e) {
    e.originalEvent.preventDefault();
    contextCoords = [Math.round(e.latlng.lng), Math.round(e.latlng.lat)];
    
    contextMenu.style.display = 'flex';
    contextMenu.style.left = `${e.originalEvent.clientX}px`;
    contextMenu.style.top = `${e.originalEvent.clientY}px`;
  });

  document.addEventListener('click', function(e) {
    if (!contextMenu.contains(e.target)) hideContextMenu();
  });

  function hideContextMenu() { contextMenu.style.display = 'none'; }

  function copyContextCoords() {
    if (activeSelectionBounds) {
      navigator.clipboard.writeText(JSON.stringify(activeSelectionBounds));
      alert(`Copied Selection Bounds to clipboard!`);
    } else if (contextCoords) {
      navigator.clipboard.writeText(`[${contextCoords[1]}, ${contextCoords[0]}]`);
      alert(`Copied X: ${contextCoords[0]}, Y: ${contextCoords[1]}`);
    }
    hideContextMenu();
  }

  // --- DETAIL & ANNOTATION SYSTEM ---
  function openDetailModal() {
    hideContextMenu();
    document.getElementById('detail-modal').classList.add('active');
  }

  function closeDetailModal() {
    document.getElementById('detail-modal').classList.remove('active');
  }

  function saveDetailNote() {
    const title = document.getElementById('detail-title').value || 'Tactical Sector';
    const color = document.getElementById('detail-color').value;
    const notes = document.getElementById('detail-notes').value;

    let targetBounds = activeSelectionBounds;
    if (!targetBounds && contextCoords) {
      targetBounds = [[contextCoords[1] - 1, contextCoords[0] - 1], [contextCoords[1] + 1, contextCoords[0] + 1]];
    }

    if (!targetBounds) { alert('No tile or area selected.'); return; }

    state.annotations.push({
      id: Date.now().toString(),
      title: title,
      color: color,
      notes: notes,
      bounds: targetBounds
    });

    closeDetailModal();
    clearCurrentSelection();
    saveState();
  }

  // --- RENDER CITIES & ANNOTATIONS (STRICT WHOLE-INTEGER BOUNDS) ---
  let cityMarkersGroup = L.layerGroup().addTo(map);
  let mapElementsLayer = L.layerGroup().addTo(map);

  function renderCities(filterLvl = 'all', searchQuery = '') {
    cityMarkersGroup.clearLayers();
    const cityList = document.getElementById('city-directory-list');
    cityList.innerHTML = '';

    CITY_DATABASE.forEach(city => {
      if (filterLvl !== 'all' && city.lvl.toString() !== filterLvl) return;
      if (searchQuery && !city.name.toLowerCase().includes(searchQuery.toLowerCase())) return;

      let cityBounds;
      
      if (city.lvl === 7) {
        // Level 7 Royal City: Exact integer bounds [[448, 448], [552, 552]] (104x104 whole integer tiles)
        cityBounds = [[448, 448], [552, 552]];
      } else {
        // Level 1-6 Cities: Exact 13x13 whole-integer tile square from [Y-6, X-6] to [Y+7, X+7]
        cityBounds = [
          [city.y - 6, city.x - 6],
          [city.y + 7, city.x + 7]
        ];
      }

      const color = LEVEL_COLORS[city.lvl] || '#ffffff';

      const citySquare = L.rectangle(cityBounds, {
        color: color, weight: city.lvl >= 6 ? 2 : 1, fillColor: color, fillOpacity: city.lvl === 7 ? 0.35 : 0.25
      }).addTo(cityMarkersGroup);

      citySquare.bindPopup(`
        <div style="font-family:var(--font-mono); text-align:center;">
          <span class="lvl-badge lvl-${city.lvl}">LVL ${city.lvl}</span>
          <b>${city.name}</b><br>
          <span style="font-size:12px; color:#8b949e;">Center: X:${city.x} | Y:${city.y}</span><br>
          <span style="font-size:11px; color:var(--accent-cyan);">
            ${city.lvl === 7 ? '104x104 Core Tile Bounds' : '13x13 Integer Tile Grid Box'}
          </span>
        </div>
      `);

      cityList.innerHTML += `
        <div class="list-item" onclick="jumpToCity(${city.x}, ${city.y})" style="cursor:pointer;">
          <div class="list-info">
            <span class="lvl-badge lvl-${city.lvl}">L${city.lvl}</span>
            <b>${city.name}</b>
          </div>
          <span style="font-family:var(--font-mono); font-size:11px; color:var(--accent-cyan);">[${city.x}, ${city.y}]</span>
        </div>
      `;
    });
  }

  function jumpToCity(x, y) { map.setView([y, x], 4); }
  function filterCitiesByLevel(lvl) { renderCities(lvl, document.getElementById('search-city').value); }
  function searchCities(query) { renderCities(document.getElementById('filter-level').value, query); }

  // --- TACTICAL PATH PLOTTER ENGINE ---
  let isPathDrawing = false;
  let activePathCoords = [];
  let tempPathLayer = L.layerGroup().addTo(map);

  function togglePathDrawing() {
    isPathDrawing = !isPathDrawing;
    document.getElementById('btn-draw-path').classList.toggle('active', isPathDrawing);
    map.getContainer().style.cursor = isPathDrawing ? 'crosshair' : '';
  }

  map.on('click', function(e) {
    if (isPathDrawing) {
      const x = Math.round(e.latlng.lng);
      const y = Math.round(e.latlng.lat);
      activePathCoords.push([y, x]);
      renderTempPath();
    } else if (isPolyDrawing) {
      const x = Math.round(e.latlng.lng);
      const y = Math.round(e.latlng.lat);
      activePolyCoords.push([y, x]);
      renderTempPoly();
    }
  });

  function renderTempPath() {
    tempPathLayer.clearLayers();
    if (activePathCoords.length === 0) return;
    const color = document.getElementById('path-color').value;
    const style = document.getElementById('path-style').value;
    L.polyline(activePathCoords, { color: color, weight: 3, opacity: 0.9, className: style === 'animated' ? 'animated-path' : '' }).addTo(tempPathLayer);
  }

  function clearCurrentPath() { activePathCoords = []; tempPathLayer.clearLayers(); }

  function saveActivePath() {
    if (activePathCoords.length < 2) { alert('Plot at least 2 points to save a path.'); return; }
    state.paths.push({
      id: Date.now().toString(),
      name: document.getElementById('path-name').value || 'Tactical Path',
      color: document.getElementById('path-color').value,
      style: document.getElementById('path-style').value,
      coords: [...activePathCoords]
    });
    clearCurrentPath();
    if (isPathDrawing) togglePathDrawing();
    saveState();
  }

  // --- TERRITORY POLYGON ENGINE ---
  let isPolyDrawing = false;
  let activePolyCoords = [];
  let tempPolyLayer = L.layerGroup().addTo(map);

  function togglePolyDrawing() {
    isPolyDrawing = !isPolyDrawing;
    document.getElementById('btn-draw-poly').classList.toggle('active', isPolyDrawing);
  }

  function renderTempPoly() {
    tempPolyLayer.clearLayers();
    if (activePolyCoords.length === 0) return;
    const color = document.getElementById('zone-color').value;
    L.polygon(activePolyCoords, { color: color, fillColor: color, fillOpacity: 0.25 }).addTo(tempPolyLayer);
  }

  function clearActivePoly() { activePolyCoords = []; tempPolyLayer.clearLayers(); }

  function saveActiveZone() {
    if (activePolyCoords.length < 3) { alert('Click at least 3 points to define a territory sector.'); return; }
    state.zones.push({
      id: Date.now().toString(),
      name: document.getElementById('zone-name').value || 'Territory Sector',
      color: document.getElementById('zone-color').value,
      coords: [...activePolyCoords]
    });
    clearActivePoly();
    if (isPolyDrawing) togglePolyDrawing();
    saveState();
  }

  // --- RENDER ALL USER ELEMENTS ---
  function renderAll() {
    mapElementsLayer.clearLayers();

    // Render Annotations / Detail Notes
    const notesList = document.getElementById('annotations-list');
    notesList.innerHTML = '';
    state.annotations.forEach(ann => {
      const rect = L.rectangle(ann.bounds, {
        color: ann.color, weight: 2, fillColor: ann.color, fillOpacity: 0.35
      }).addTo(mapElementsLayer);

      rect.bindPopup(`
        <div style="font-family:var(--font-mono);">
          <b style="color:${ann.color};">${ann.title}</b><br>
          <p style="font-size:12px; margin-top:4px;">${ann.notes}</p>
        </div>
      `);

      notesList.innerHTML += `
        <div class="list-item">
          <div class="list-info">
            <b style="color:${ann.color};">${ann.title}</b>
            <p style="font-size:11px; color:#8b949e;">${ann.notes.substring(0, 30)}...</p>
          </div>
          <button class="btn btn-danger" onclick="deleteAnnotation('${ann.id}')"><i class="fa-solid fa-trash"></i></button>
        </div>
      `;
    });

    // Render Zones
    const zonesList = document.getElementById('saved-zones-list');
    zonesList.innerHTML = '';
    state.zones.forEach(zone => {
      L.polygon(zone.coords, { color: zone.color, fillColor: zone.color, fillOpacity: 0.2 }).addTo(mapElementsLayer);
      zonesList.innerHTML += `
        <div class="list-item">
          <div class="list-info" style="color:${zone.color};">${zone.name}</div>
          <button class="btn btn-danger" onclick="deleteZone('${zone.id}')"><i class="fa-solid fa-trash"></i></button>
        </div>
      `;
    });

    // Render Paths
    const pathsList = document.getElementById('saved-paths-list');
    pathsList.innerHTML = '';
    state.paths.forEach(p => {
      L.polyline(p.coords, {
        color: p.color, weight: 3, opacity: 0.9, className: p.style === 'animated' ? 'animated-path' : ''
      }).addTo(mapElementsLayer);

      pathsList.innerHTML += `
        <div class="list-item">
          <div class="list-info" style="color:${p.color};">${p.name}</div>
          <button class="btn btn-danger" onclick="deletePath('${p.id}')"><i class="fa-solid fa-trash"></i></button>
        </div>
      `;
    });
  }

  function deleteAnnotation(id) { state.annotations = state.annotations.filter(a => a.id !== id); saveState(); }
  function deleteZone(id) { state.zones = state.zones.filter(z => z.id !== id); saveState(); }
  function deletePath(id) { state.paths = state.paths.filter(p => p.id !== id); saveState(); }

  // --- UI TOGGLES ---
  function togglePanel(id) {
    document.querySelectorAll('.side-panel').forEach(p => p.classList.add('collapsed'));
    document.getElementById(`panel-${id}`).classList.remove('collapsed');
  }
  function closePanels() {
    document.querySelectorAll('.side-panel').forEach(p => p.classList.add('collapsed'));
  }

  // --- DATA MODAL & EXPORT/IMPORT ---
  function openDataModal() { document.getElementById('data-modal').classList.add('active'); }
  function closeDataModal() { document.getElementById('data-modal').classList.remove('active'); }

  function copyDataToClipboard() {
    navigator.clipboard.writeText(JSON.stringify(state));
    alert('Alliance Map Data copied to clipboard!');
  }

  function pasteDataFromClipboard() {
    const str = prompt('Paste Alliance Map JSON Data:');
    if (!str) return;
    try {
      state = JSON.parse(str);
      saveState();
      closeDataModal();
      alert('Map Data loaded successfully!');
    } catch(e) {
      alert('Invalid Data Format');
    }
  }

  function exportJSONFile() {
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `last_asylum_map_data.json`;
    a.click();
  }

  function importJSONFile(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(evt) {
      try {
        state = JSON.parse(evt.target.result);
        saveState();
        closeDataModal();
        alert('Alliance Map File imported successfully!');
      } catch(err) {
        alert('Failed to read JSON file.');
      }
    };
    reader.readAsText(file);
  }

  // Initial Initialization
  renderCities();
  renderAll();
</script>
</body>
</html>
