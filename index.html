<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Last Asylum: Plague - Tactical Command Map</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  
  <style>
    :root {
      --bg-dark: #0a0c10;
      --panel-bg: rgba(13, 17, 23, 0.92);
      --border-color: rgba(0, 255, 204, 0.25);
      --text-main: #e6edf3;
      --accent-cyan: #00ffcc;
      --accent-red: #ff3366;
      --accent-gold: #ffcc00;
      --accent-purple: #9933ff;
      --font-mono: 'JetBrains Mono', 'Courier New', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: var(--bg-dark); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: var(--text-main); }

    #map { width: 100vw; height: 100vh; background: #050608; }

    /* Top Navigation Bar */
    .top-bar {
      position: absolute; top: 12px; left: 12px; right: 12px; z-index: 1000;
      display: flex; gap: 8px; align-items: center; justify-content: space-between;
      pointer-events: none;
    }
    .top-group { display: flex; gap: 8px; pointer-events: auto; }

    .btn {
      background: var(--panel-bg); border: 1px solid var(--border-color); color: var(--accent-cyan);
      padding: 8px 14px; font-size: 13px; font-family: var(--font-mono); border-radius: 4px;
      cursor: pointer; backdrop-filter: blur(8px); display: flex; align-items: center; gap: 6px;
      transition: all 0.2s ease;
    }
    .btn:hover { background: rgba(0, 255, 204, 0.15); border-color: var(--accent-cyan); box-shadow: 0 0 10px rgba(0,255,204,0.3); }
    .btn.active { background: var(--accent-cyan); color: #000; font-weight: bold; }
    .btn-danger { color: var(--accent-red); border-color: rgba(255, 51, 102, 0.3); }
    .btn-danger:hover { background: rgba(255, 51, 102, 0.2); border-color: var(--accent-red); }

    /* HUD Controls & Coordinates Bar */
    .hud-bar {
      position: absolute; bottom: 12px; left: 12px; z-index: 1000;
      background: var(--panel-bg); border: 1px solid var(--border-color);
      padding: 6px 14px; font-family: var(--font-mono); font-size: 13px;
      color: var(--accent-cyan); border-radius: 4px; backdrop-filter: blur(8px);
      pointer-events: auto;
    }

    /* Side Control Panels */
    .side-panel {
      position: absolute; top: 60px; right: 12px; bottom: 50px; width: 340px; z-index: 1000;
      background: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 6px;
      backdrop-filter: blur(12px); display: flex; flex-direction: column; overflow: hidden;
      box-shadow: 0 8px 32px rgba(0,0,0,0.8); transition: transform 0.3s ease;
    }
    .side-panel.collapsed { transform: translateX(360px); }

    .panel-header {
      padding: 12px 16px; border-bottom: 1px solid var(--border-color);
      display: flex; justify-content: space-between; align-items: center;
      background: rgba(0, 255, 204, 0.05);
    }
    .panel-header h3 { font-family: var(--font-mono); font-size: 14px; text-transform: uppercase; letter-spacing: 1px; color: var(--accent-cyan); }
    .panel-body { padding: 16px; overflow-y: auto; flex: 1; display: flex; flex-direction: flex-start; flex-direction: column; gap: 16px; }

    .input-group { display: flex; flex-direction: column; gap: 6px; }
    .input-group label { font-size: 11px; font-family: var(--font-mono); color: #8b949e; text-transform: uppercase; }
    .input-row { display: flex; gap: 8px; }
    
    input, select, textarea {
      background: rgba(0,0,0,0.5); border: 1px solid var(--border-color); color: var(--text-main);
      padding: 8px; font-family: var(--font-mono); font-size: 12px; border-radius: 4px; width: 100%;
    }
    input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent-cyan); }

    .list-item {
      background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08);
      border-radius: 4px; padding: 10px; display: flex; justify-content: space-between; align-items: center;
    }
    .list-item:hover { border-color: var(--border-color); }
    .list-info { font-family: var(--font-mono); font-size: 12px; }
    .list-actions { display: flex; gap: 6px; }

    /* Modal Overlay */
    .modal {
      position: fixed; inset: 0; z-index: 2000; background: rgba(0,0,0,0.8);
      display: none; justify-content: center; align-items: center; backdrop-filter: blur(4px);
    }
    .modal.active { display: flex; }
    .modal-content {
      background: var(--bg-dark); border: 1px solid var(--accent-cyan); border-radius: 8px;
      width: 480px; max-width: 90vw; padding: 20px; display: flex; flex-direction: column; gap: 16px;
      box-shadow: 0 0 20px rgba(0,255,204,0.2);
    }

    /* Animated Motion Path Stroke */
    @keyframes dash {
      to { stroke-dashoffset: -40; }
    }
    .animated-path {
      stroke-dasharray: 10, 10;
      animation: dash 1.5s linear infinite;
    }
  </style>
</head>
<body>

<div id="map"></div>

<!-- Top Navigation -->
<div class="top-bar">
  <div class="top-group">
    <button class="btn" onclick="togglePanel('plotter')"><i class="fa-solid fa-route"></i> Path Plotter</button>
    <button class="btn" onclick="togglePanel('boundaries')"><i class="fa-solid fa-draw-polygon"></i> Territories</button>
    <button class="btn" onclick="togglePanel('pins')"><i class="fa-solid fa-location-dot"></i> Markers</button>
  </div>
  <div class="top-group">
    <button class="btn" onclick="openDataModal()"><i class="fa-solid fa-share-nodes"></i> Export / Import</button>
  </div>
</div>

<!-- Bottom Coordinate Tracker -->
<div class="hud-bar" id="hud-coords">X: 000 | Y: 000</div>

<!-- SIDE PANEL: TACTICAL PATH & PATTERN PLOTTER -->
<div class="side-panel" id="panel-plotter">
  <div class="panel-header">
    <h3><i class="fa-solid fa-route"></i> Tactical Path Plotter</h3>
    <button class="btn btn-danger" onclick="closePanels()"><i class="fa-solid fa-xmark"></i></button>
  </div>
  <div class="panel-body">
    <div class="input-group">
      <label>Plotting Mode</label>
      <div class="input-row">
        <button class="btn" id="btn-draw-path" onclick="togglePathDrawing()" style="flex:1;">
          <i class="fa-solid fa-pen-nib"></i> Click-to-Plot
        </button>
        <button class="btn btn-danger" onclick="clearCurrentPath()"><i class="fa-solid fa-trash"></i> Reset</button>
      </div>
    </div>

    <div class="input-group">
      <label>Path Label & Color</label>
      <input type="text" id="path-name" placeholder="e.g. Squad Alpha March Route" value="Patrol Vector" />
      <div class="input-row">
        <input type="color" id="path-color" value="#00ffcc" style="height:36px; cursor:pointer;" />
        <select id="path-style">
          <option value="solid">Solid Line</option>
          <option value="animated">Animated March Vector</option>
        </select>
      </div>
    </div>

    <!-- Pattern Generators -->
    <div class="input-group" style="border-top:1px solid var(--border-color); padding-top:12px;">
      <label>Automated Pattern Generator</label>
      <select id="pattern-type" onchange="updatePatternUI()">
        <option value="lawnmower">Patrol Grid (Lawn Mower)</option>
        <option value="rings">Concentric Search Rings</option>
        <option value="starburst">Radial Outpost Recon</option>
      </select>
    </div>

    <div class="input-row">
      <div class="input-group" style="flex:1;">
        <label>Center X</label>
        <input type="number" id="pat-x" value="500" min="0" max="1000" />
      </div>
      <div class="input-group" style="flex:1;">
        <label>Center Y</label>
        <input type="number" id="pat-y" value="500" min="0" max="1000" />
      </div>
    </div>

    <div class="input-row">
      <div class="input-group" style="flex:1;">
        <label>Size / Radius</label>
        <input type="number" id="pat-size" value="200" step="10" />
      </div>
      <div class="input-group" style="flex:1;">
        <label>Passes / Rings</label>
        <input type="number" id="pat-passes" value="4" min="1" max="10" />
      </div>
    </div>

    <button class="btn" onclick="generatePattern()"><i class="fa-solid fa-wand-magic-sparkles"></i> Generate Pattern</button>

    <!-- Batch Coordinate String Input -->
    <div class="input-group" style="border-top:1px solid var(--border-color); padding-top:12px;">
      <label>Batch Coordinate Input</label>
      <textarea id="batch-coords" rows="2" placeholder="Paste coords: [100, 200], [300, 400], [500, 800]"></textarea>
      <button class="btn" onclick="plotBatchCoordinates()"><i class="fa-solid fa-file-import"></i> Plot Coordinates</button>
    </div>

    <button class="btn" onclick="saveActivePath()" style="background:var(--accent-cyan); color:#000; font-weight:bold; margin-top:8px;">
      <i class="fa-solid fa-floppy-disk"></i> Save Path to Map
    </button>

    <!-- Saved Paths List -->
    <div class="input-group" style="border-top:1px solid var(--border-color); padding-top:12px;">
      <label>Saved Tactical Paths</label>
      <div id="saved-paths-list" style="display:flex; flex-direction:column; gap:8px;"></div>
    </div>
  </div>
</div>

<!-- SIDE PANEL: TERRITORY BOUNDARIES -->
<div class="side-panel collapsed" id="panel-boundaries">
  <div class="panel-header">
    <h3><i class="fa-solid fa-draw-polygon"></i> Territory Zones</h3>
    <button class="btn btn-danger" onclick="closePanels()"><i class="fa-solid fa-xmark"></i></button>
  </div>
  <div class="panel-body">
    <p style="font-size:12px; color:#8b949e;">Draw closed territorial zones and sector perimeters.</p>
    <div class="input-row">
      <button class="btn" id="btn-draw-poly" onclick="togglePolyDrawing()" style="flex:1;">
        <i class="fa-solid fa-draw-polygon"></i> Draw Sector
      </button>
      <button class="btn btn-danger" onclick="clearActivePoly()"><i class="fa-solid fa-trash"></i> Clear</button>
    </div>
    <div class="input-group">
      <label>Zone Name & Color</label>
      <input type="text" id="zone-name" placeholder="e.g. Alliance Sector 4" value="Alliance Territory" />
      <input type="color" id="zone-color" value="#00ffcc" style="height:36px; cursor:pointer;" />
    </div>
    <button class="btn" onclick="saveActiveZone()" style="background:var(--accent-cyan); color:#000; font-weight:bold;">
      <i class="fa-solid fa-floppy-disk"></i> Save Territory Zone
    </button>
    <div id="saved-zones-list" style="display:flex; flex-direction:column; gap:8px; margin-top:12px;"></div>
  </div>
</div>

<!-- SIDE PANEL: PINS / MARKERS -->
<div class="side-panel collapsed" id="panel-pins">
  <div class="panel-header">
    <h3><i class="fa-solid fa-location-dot"></i> Tactical Markers</h3>
    <button class="btn btn-danger" onclick="closePanels()"><i class="fa-solid fa-xmark"></i></button>
  </div>
  <div class="panel-body">
    <div class="input-group">
      <label>Jump to Coordinates</label>
      <div class="input-row">
        <input type="number" id="jump-x" placeholder="X" min="0" max="1000" />
        <input type="number" id="jump-y" placeholder="Y" min="0" max="1000" />
        <button class="btn" onclick="jumpToCoords()"><i class="fa-solid fa-crosshairs"></i></button>
      </div>
    </div>
    <div id="saved-pins-list" style="display:flex; flex-direction:column; gap:8px;"></div>
  </div>
</div>

<!-- EXPORT / IMPORT MODAL -->
<div class="modal" id="data-modal">
  <div class="modal-content">
    <h3 style="font-family:var(--font-mono); color:var(--accent-cyan);"><i class="fa-solid fa-share-nodes"></i> Alliance Data Hub</h3>
    <p style="font-size:12px; color:#8b949e;">Export map data to share march paths, territory boundaries, and pins with your alliance team.</p>
    
    <div class="input-group">
      <label>Quick Clipboard Sync</label>
      <div class="input-row">
        <button class="btn" onclick="copyDataToClipboard()" style="flex:1;"><i class="fa-solid fa-copy"></i> Copy Data Code</button>
        <button class="btn" onclick="pasteDataFromClipboard()" style="flex:1;"><i class="fa-solid fa-paste"></i> Paste & Load</button>
      </div>
    </div>

    <div class="input-group">
      <label>File Export / Import</label>
      <div class="input-row">
        <button class="btn" onclick="exportJSONFile()" style="flex:1;"><i class="fa-solid fa-download"></i> Download JSON</button>
        <input type="file" id="file-import" accept=".json" onchange="importJSONFile(event)" style="display:none;" />
        <button class="btn" onclick="document.getElementById('file-import').click()" style="flex:1;"><i class="fa-solid fa-upload"></i> Upload JSON</button>
      </div>
    </div>

    <button class="btn btn-danger" onclick="closeDataModal()" style="margin-top:8px;">Close</button>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  // --- MAP CONFIGURATION (1000x1000 Canvas) ---
  const MAP_SIZE = 1000;
  const bounds = [[0, 0], [MAP_SIZE, MAP_SIZE]];

  const map = L.map('map', {
    crs: L.CRS.Simple,
    maxZoom: 4,
    minZoom: -1,
    maxBounds: bounds,
    attributionControl: false
  });

  // Load Map Graphic
  L.imageOverlay('map.png', bounds).addTo(map);
  map.fitBounds(bounds);

  // Grid Lines (100px Intervals)
  for (let i = 0; i <= MAP_SIZE; i += 100) {
    L.polyline([[0, i], [MAP_SIZE, i]], { color: 'rgba(255,255,255,0.15)', weight: 1 }).addTo(map);
    L.polyline([[i, 0], [i, MAP_SIZE]], { color: 'rgba(255,255,255,0.15)', weight: 1 }).addTo(map);
  }

  // --- STATE STORAGE ---
  let state = {
    pins: JSON.parse(localStorage.getItem('asylum_pins')) || [
      { id: '1', name: 'Central Base', x: 500, y: 500, cat: 'base' }
    ],
    zones: JSON.parse(localStorage.getItem('asylum_zones')) || [],
    paths: JSON.parse(localStorage.getItem('asylum_paths')) || []
  };

  function saveState() {
    localStorage.setItem('asylum_pins', JSON.stringify(state.pins));
    localStorage.setItem('asylum_zones', JSON.stringify(state.zones));
    localStorage.setItem('asylum_paths', JSON.stringify(state.paths));
    renderAll();
  }

  // --- HUD TRACKER & CLICK MARKER ---
  const hudCoords = document.getElementById('hud-coords');
  let clickMarker = null;

  map.on('mousemove', function(e) {
    const x = Math.round(e.latlng.lng);
    const y = Math.round(e.latlng.lat);
    hudCoords.innerText = `X: ${x.toString().padStart(3,'0')} | Y: ${y.toString().padStart(3,'0')}`;
  });

  map.on('click', function(e) {
    if (isPathDrawing || isPolyDrawing) return;
    const x = Math.round(e.latlng.lng);
    const y = Math.round(e.latlng.lat);

    if (clickMarker) map.removeLayer(clickMarker);
    clickMarker = L.marker([y, x]).addTo(map);
    
    clickMarker.bindPopup(`
      <div style="font-family:var(--font-mono); text-align:center;">
        <b>Target Coordinates</b><br>X: ${x} | Y: ${y}<br>
        <button class="btn" style="width:100%; margin-top:6px;" onclick="addPinFromClick(${x}, ${y})">Add Marker</button>
      </div>
    `).openPopup();
  });

  function addPinFromClick(x, y) {
    const name = prompt("Marker Name:", "New Target");
    if (!name) return;
    state.pins.push({ id: Date.now().toString(), name: name, x: x, y: y, cat: 'target' });
    if (clickMarker) map.removeLayer(clickMarker);
    saveState();
  }

  // --- TACTICAL PATH PLOTTER ENGINE ---
  let isPathDrawing = false;
  let activePathCoords = [];
  let tempPathLayer = L.layerGroup().addTo(map);

  function togglePathDrawing() {
    isPathDrawing = !isPathDrawing;
    const btn = document.getElementById('btn-draw-path');
    btn.classList.toggle('active', isPathDrawing);
    if (isPathDrawing) {
      map.getContainer().style.cursor = 'crosshair';
    } else {
      map.getContainer().style.cursor = '';
    }
  }

  map.on('click', function(e) {
    if (!isPathDrawing) return;
    const x = Math.round(e.latlng.lng);
    const y = Math.round(e.latlng.lat);
    activePathCoords.push([y, x]);
    renderTempPath();
  });

  function renderTempPath() {
    tempPathLayer.clearLayers();
    if (activePathCoords.length === 0) return;

    const color = document.getElementById('path-color').value;
    const style = document.getElementById('path-style').value;

    const polyline = L.polyline(activePathCoords, {
      color: color, weight: 3, opacity: 0.9,
      className: style === 'animated' ? 'animated-path' : ''
    }).addTo(tempPathLayer);

    activePathCoords.forEach((pt, i) => {
      L.circleMarker(pt, { radius: 4, color: color, fillColor: '#000', fillOpacity: 1 }).addTo(tempPathLayer);
    });
  }

  function clearCurrentPath() {
    activePathCoords = [];
    tempPathLayer.clearLayers();
  }

  function saveActivePath() {
    if (activePathCoords.length < 2) { alert('Plot at least 2 points to save a path.'); return; }
    const name = document.getElementById('path-name').value || 'Tactical Path';
    const color = document.getElementById('path-color').value;
    const style = document.getElementById('path-style').value;

    state.paths.push({
      id: Date.now().toString(),
      name: name,
      color: color,
      style: style,
      coords: [...activePathCoords]
    });

    clearCurrentPath();
    if (isPathDrawing) togglePathDrawing();
    saveState();
  }

  // --- AUTOMATED PATTERN GENERATOR ---
  function generatePattern() {
    const type = document.getElementById('pattern-type').value;
    const cx = parseInt(document.getElementById('pat-x').value) || 500;
    const cy = parseInt(document.getElementById('pat-y').value) || 500;
    const size = parseInt(document.getElementById('pat-size').value) || 200;
    const passes = parseInt(document.getElementById('pat-passes').value) || 4;

    activePathCoords = [];

    if (type === 'lawnmower') {
      const step = size / passes;
      let startX = cx - size/2;
      let startY = cy - size/2;
      for (let i = 0; i <= passes; i++) {
        let currentY = startY + (i * step);
        if (i % 2 === 0) {
          activePathCoords.push([currentY, startX]);
          activePathCoords.push([currentY, startX + size]);
        } else {
          activePathCoords.push([currentY, startX + size]);
          activePathCoords.push([currentY, startX]);
        }
      }
    } else if (type === 'rings') {
      const radStep = (size / 2) / passes;
      for (let r = 1; r <= passes; r++) {
        const radius = r * radStep;
        for (let a = 0; a <= 360; a += 30) {
          const rad = (a * Math.PI) / 180;
          activePathCoords.push([cy + radius * Math.sin(rad), cx + radius * Math.cos(rad)]);
        }
      }
    } else if (type === 'starburst') {
      const radius = size / 2;
      for (let a = 0; a < 360; a += (360 / passes)) {
        const rad = (a * Math.PI) / 180;
        activePathCoords.push([cy, cx]);
        activePathCoords.push([cy + radius * Math.sin(rad), cx + radius * Math.cos(rad)]);
      }
    }

    renderTempPath();
  }

  function plotBatchCoordinates() {
    const str = document.getElementById('batch-coords').value;
    const regex = /\[?\s*(\d+)\s*,\s*(\d+)\s*\]?/g;
    let match;
    activePathCoords = [];
    while ((match = regex.exec(str)) !== null) {
      activePathCoords.push([parseInt(match[2]), parseInt(match[1])]); // Leaflet uses [Y, X]
    }
    if (activePathCoords.length > 0) {
      renderTempPath();
    } else {
      alert('No valid coordinates found. Format: [100, 200], [300, 400]');
    }
  }

  // --- TERRITORY POLYGON ENGINE ---
  let isPolyDrawing = false;
  let activePolyCoords = [];
  let tempPolyLayer = L.layerGroup().addTo(map);

  function togglePolyDrawing() {
    isPolyDrawing = !isPolyDrawing;
    document.getElementById('btn-draw-poly').classList.toggle('active', isPolyDrawing);
  }

  map.on('click', function(e) {
    if (!isPolyDrawing) return;
    const x = Math.round(e.latlng.lng);
    const y = Math.round(e.latlng.lat);
    activePolyCoords.push([y, x]);
    renderTempPoly();
  });

  function renderTempPoly() {
    tempPolyLayer.clearLayers();
    if (activePolyCoords.length === 0) return;
    const color = document.getElementById('zone-color').value;
    L.polygon(activePolyCoords, { color: color, fillColor: color, fillOpacity: 0.25 }).addTo(tempPolyLayer);
  }

  function clearActivePoly() {
    activePolyCoords = [];
    tempPolyLayer.clearLayers();
  }

  function saveActiveZone() {
    if (activePolyCoords.length < 3) { alert('Click at least 3 points to define a territory sector.'); return; }
    state.zones.push({
      id: Date.now().toString(),
      name: document.getElementById('zone-name').value || 'Territory Sector',
      color: document.getElementById('zone-color').value,
      coords: [...activePolyCoords]
    });
    clearActivePoly();
    if (isPolyDrawing) togglePolyDrawing();
    saveState();
  }

  // --- RENDER ALL MAP ELEMENTS ---
  let mapElementsLayer = L.layerGroup().addTo(map);

  function renderAll() {
    mapElementsLayer.clearLayers();

    // 1. Render Pins
    state.pins.forEach(pin => {
      L.marker([pin.y, pin.x]).addTo(mapElementsLayer)
       .bindPopup(`<b>${pin.name}</b><br>X: ${pin.x} | Y: ${pin.y}`);
    });

    // 2. Render Territory Zones
    const zonesList = document.getElementById('saved-zones-list');
    zonesList.innerHTML = '';
    state.zones.forEach(zone => {
      L.polygon(zone.coords, { color: zone.color, fillColor: zone.color, fillOpacity: 0.2 }).addTo(mapElementsLayer);
      zonesList.innerHTML += `
        <div class="list-item">
          <div class="list-info" style="color:${zone.color};">${zone.name}</div>
          <button class="btn btn-danger" onclick="deleteZone('${zone.id}')"><i class="fa-solid fa-trash"></i></button>
        </div>
      `;
    });

    // 3. Render Paths
    const pathsList = document.getElementById('saved-paths-list');
    pathsList.innerHTML = '';
    state.paths.forEach(p => {
      L.polyline(p.coords, {
        color: p.color, weight: 3, opacity: 0.9,
        className: p.style === 'animated' ? 'animated-path' : ''
      }).addTo(mapElementsLayer);

      pathsList.innerHTML += `
        <div class="list-item">
          <div class="list-info" style="color:${p.color};">${p.name}</div>
          <button class="btn btn-danger" onclick="deletePath('${p.id}')"><i class="fa-solid fa-trash"></i></button>
        </div>
      `;
    });

    // Pins Side Panel List
    const pinsList = document.getElementById('saved-pins-list');
    pinsList.innerHTML = '';
    state.pins.forEach(p => {
      pinsList.innerHTML += `
        <div class="list-item">
          <div class="list-info"><b>${p.name}</b> [X:${p.x}, Y:${p.y}]</div>
          <button class="btn btn-danger" onclick="deletePin('${p.id}')"><i class="fa-solid fa-trash"></i></button>
        </div>
      `;
    });
  }

  function deletePin(id) { state.pins = state.pins.filter(p => p.id !== id); saveState(); }
  function deleteZone(id) { state.zones = state.zones.filter(z => z.id !== id); saveState(); }
  function deletePath(id) { state.paths = state.paths.filter(p => p.id !== id); saveState(); }

  // --- UI TOGGLES ---
  function togglePanel(id) {
    document.querySelectorAll('.side-panel').forEach(p => p.classList.add('collapsed'));
    document.getElementById(`panel-${id}`).classList.remove('collapsed');
  }
  function closePanels() {
    document.querySelectorAll('.side-panel').forEach(p => p.classList.add('collapsed'));
  }

  function jumpToCoords() {
    const x = parseInt(document.getElementById('jump-x').value);
    const y = parseInt(document.getElementById('jump-y').value);
    if (!isNaN(x) && !isNaN(y)) {
      map.setView([y, x], 2);
    }
  }

  // --- DATA MODAL & EXPORT/IMPORT ---
  function openDataModal() { document.getElementById('data-modal').classList.add('active'); }
  function closeDataModal() { document.getElementById('data-modal').classList.remove('active'); }

  function copyDataToClipboard() {
    navigator.clipboard.writeText(JSON.stringify(state));
    alert('Alliance Map Data copied to clipboard!');
  }

  function pasteDataFromClipboard() {
    const str = prompt('Paste Alliance Map JSON Data:');
    if (!str) return;
    try {
      state = JSON.parse(str);
      saveState();
      closeDataModal();
      alert('Map Data loaded successfully!');
    } catch(e) {
      alert('Invalid Data Format');
    }
  }

  function exportJSONFile() {
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `last_asylum_map_data.json`;
    a.click();
  }

  function importJSONFile(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(evt) {
      try {
        state = JSON.parse(evt.target.result);
        saveState();
        closeDataModal();
        alert('Alliance Map File imported successfully!');
      } catch(err) {
        alert('Failed to read JSON file.');
      }
    };
    reader.readAsText(file);
  }

  // Initial Load
  renderAll();
</script>
</body>
</html>
